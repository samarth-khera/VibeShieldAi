name: VibeShield Security Scanner Worker
run-name: VibeShield ${{ inputs.mode || 'scan' }} ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'VibeShield Scan Job ID'
        required: true
        type: string
      repository_url:
        description: 'Public GitHub repository URL to scan'
        required: true
        type: string
      callback_url:
        description: 'Signed results callback endpoint'
        required: true
        type: string
      mode:
        description: 'scan, or verify an approved Auto-Fix remediation'
        required: false
        default: scan
        type: choice
        options: [scan, verify]
      remediation_id:
        description: 'Remediation ID (verify mode only). The diff itself is fetched from the signed API.'
        required: false
        default: ''
        type: string

# One group per job/remediation instead of one global group: a shared group keeps a single pending
# run and cancels older pending runs, which stranded their jobs. Bounded parallelism is enforced
# before dispatch by the database slot reservation (MAX_CONCURRENT_HEAVY_SCANS).
concurrency:
  group: vibeshield-${{ inputs.mode || 'scan' }}-${{ inputs.job_id }}-${{ inputs.remediation_id || 'none' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1 # 8.18.x has no `dir` subcommand, so it silently scanned nothing
  OSV_SCANNER_VERSION: 2.7.0
  SEMGREP_VERSION: 1.182.0 # keep in sync with .github/scanner-requirements.txt
  WORKER_MODE: ${{ inputs.mode || 'scan' }}
  JOB_ID: ${{ inputs.job_id }}
  REMEDIATION_ID: ${{ inputs.remediation_id }}
  REPOSITORY_URL: ${{ inputs.repository_url }}
  CALLBACK_URL: ${{ inputs.callback_url }}

jobs:
  scan:
    name: Execute Security Scanners (Gitleaks, Semgrep, OSV-Scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Record runner start
        run: echo "RUNNER_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_ENV"

      - name: Checkout VibeShield AI
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Uses only Node built-ins, so it runs before any dependency is installed.
      - name: Report worker started
        env:
          CALLBACK_SECRET: ${{ secrets.SCAN_CALLBACK_SECRET }}
        run: node scripts/ci/post-worker-status.mjs started

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python for Semgrep
        id: py
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/scanner-requirements.txt

      # Runner-owned path: the cache action cannot restore into root-owned system directories.
      # The key pins tool versions and the exact Python build the Semgrep venv links against.
      - name: Restore scanner tool cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.vibeshield/bin
            ~/.vibeshield/semgrep-venv
          key: scanner-tools-v2-${{ runner.os }}-${{ runner.arch }}-py${{ steps.py.outputs.python-version }}-gitleaks${{ env.GITLEAKS_VERSION }}-osv${{ env.OSV_SCANNER_VERSION }}-${{ hashFiles('.github/scanner-requirements.txt', 'scripts/ci/install-scanners.sh') }}

      # Verifies pinned SHA-256s on every run, so a stale or tampered cache entry is reinstalled.
      - name: Install or verify scanners
        run: bash scripts/ci/install-scanners.sh

      # OSV-Scanner queries the live OSV API (always-current advisories). No offline database is
      # cached: OSV runs in parallel with the slower Semgrep pass, so it is not on the critical path.

      # node_modules is produced only by `npm ci` from this exact lockfile; the key changes with it.
      - name: Restore worker dependencies
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: worker-node-modules-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json') }}

      # --ignore-scripts: no third-party install scripts run, and the worker does not use Prisma.
      - name: Install worker dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Report dependency cache status
        run: echo "CACHE_STATUS node_modules=${{ steps.node-modules.outputs.cache-hit == 'true' && 'hit' || 'miss' }}"

      - name: Execute scanner worker
        env:
          CALLBACK_SECRET: ${{ secrets.SCAN_CALLBACK_SECRET }}
        run: npx --no-install tsx scripts/run-actions-worker.ts

      # Ensures a job is never left pending when setup breaks or the run is cancelled. The API
      # ignores this if the worker already reported a final result.
      - name: Report failure or cancellation
        if: failure() || cancelled()
        env:
          CALLBACK_SECRET: ${{ secrets.SCAN_CALLBACK_SECRET }}
        run: node scripts/ci/post-worker-status.mjs failed worker_failed "The scanner worker failed or was cancelled before reporting a result."
