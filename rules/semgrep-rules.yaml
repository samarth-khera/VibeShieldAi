rules:
  - id: js-code-execution-eval
    message: "Detected use of eval(), which can lead to arbitrary code execution if user input is supplied."
    severity: ERROR
    languages: [javascript, typescript]
    patterns:
      - pattern: eval(...)
    metadata:
      cwe: ["CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"]
      owasp: ["A03:2021 - Injection"]
      category: security
      confidence: HIGH
      remediation: "Avoid using eval(). Use JSON.parse() for data or safe dispatch patterns."

  - id: js-code-execution-function
    message: "Detected use of Function constructor, which allows dynamic code execution similar to eval()."
    severity: WARNING
    languages: [javascript, typescript]
    patterns:
      - pattern: new Function(...)
    metadata:
      cwe: ["CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"]
      owasp: ["A03:2021 - Injection"]
      category: security
      confidence: MEDIUM
      remediation: "Refactor to use static functions or a safe parser instead of dynamic code execution."

  - id: js-command-injection-child-process
    message: "Potential command injection: child_process function used with dynamic command string."
    severity: ERROR
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: child_process.exec($CMD, ...)
          - pattern: exec($CMD, ...)
    metadata:
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"]
      owasp: ["A03:2021 - Injection"]
      category: security
      confidence: MEDIUM
      remediation: "Use child_process.execFile() or spawn() with argument arrays instead of passing raw shell strings."

  - id: py-code-execution-eval
    message: "Detected use of eval() or exec() in Python, which can allow arbitrary code execution."
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)
    metadata:
      cwe: ["CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"]
      owasp: ["A03:2021 - Injection"]
      category: security
      confidence: HIGH
      remediation: "Avoid eval()/exec(). Use ast.literal_eval() for safe evaluation of literals."

  - id: py-command-injection-system
    message: "Potential command injection: os.system or subprocess with shell=True."
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: os.system(...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
    metadata:
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"]
      owasp: ["A03:2021 - Injection"]
      category: security
      confidence: HIGH
      remediation: "Pass command and arguments as a list with shell=False in subprocess.run()."

  - id: py-insecure-deserialization-pickle
    message: "Unsafe deserialization using pickle. An attacker can craft malicious pickle data to execute code."
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: pickle.loads(...)
          - pattern: pickle.load(...)
          - pattern: _pickle.loads(...)
    metadata:
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      owasp: ["A08:2021 - Software and Data Integrity Failures"]
      category: security
      confidence: HIGH
      remediation: "Do not use pickle with untrusted data. Use safer formats like JSON or Protocol Buffers."

  - id: generic-sql-injection-concat
    message: "Possible SQL injection: SQL query string formed using concatenation or interpolation."
    severity: WARNING
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: $DB.query(`SELECT ... ${$INPUT} ...`)
          - pattern: $DB.query(`INSERT ... ${$INPUT} ...`)
          - pattern: $DB.query(`UPDATE ... ${$INPUT} ...`)
          - pattern: $DB.query(`DELETE ... ${$INPUT} ...`)
          - pattern: $DB.execute(`SELECT ... ${$INPUT} ...`)
    metadata:
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"]
      owasp: ["A03:2021 - Injection"]
      category: security
      confidence: MEDIUM
      remediation: "Use parameterized queries or prepared statements instead of template literals."

  - id: generic-insecure-hash-md5-sha1
    message: "Detected use of MD5 or SHA1, which are cryptographically broken hash algorithms."
    severity: WARNING
    languages: [javascript, typescript, python]
    patterns:
      - pattern-either:
          - pattern: crypto.createHash("md5")
          - pattern: crypto.createHash("sha1")
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
    metadata:
      cwe: ["CWE-328: Use of Weak Hash"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      category: security
      confidence: HIGH
      remediation: "Use SHA-256 (SHA-2) or SHA-3 for hashing, and Argon2 or bcrypt for password hashing."

  - id: js-hardcoded-jwt-secret
    message: "Hardcoded secret or key used in jwt.sign() or jwt.verify()."
    severity: ERROR
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: jwt.sign($PAYLOAD, "...", ...)
          - pattern: jwt.verify($TOKEN, "...", ...)
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      category: security
      confidence: HIGH
      remediation: "Store the JWT secret in an environment variable or secret manager."
